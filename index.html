<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Notes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        #reply-preview {
            display: none; align-items: center; justify-content: space-between;
            background: #ffe5ec; padding: 10px 15px; border-radius: 10px; margin-bottom: 10px;
            border-left: 4px solid #d81b60; width: 100%;
        }
        #reply-preview span { font-size: 14px; color: #333; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;}
        #cancel-reply { background: none; border: none; color: #d81b60; font-size: 18px; cursor: pointer; width: auto; margin: 0; padding: 0; box-shadow: none;}
        .msg-reply-box { background: rgba(0,0,0,0.1); padding: 5px 8px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; border-left: 3px solid #fff; opacity: 0.9; }
        .msg-received .msg-reply-box { border-left-color: #d81b60; background: rgba(216,27,96,0.1); }
    </style>
</head>
<body>

    <!-- 1. NOTES SCREEN -->
    <div id="notes-screen">
        <div class="notes-header">
            <h2>My Notes</h2>
            <span class="date" id="current-date"></span>
        </div>
        <textarea id="note-content" placeholder="Yahan apne notes likhein..."></textarea>
        <div class="notes-footer">
            <button id="save-note-btn">Save Note</button>
            <p id="note-status"></p>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN -->
    <div id="login-screen" style="display: none;">
        <h2>Humari Chat 💖</h2>
        <input type="email" id="email" placeholder="Email daalein..." required>
        <input type="password" id="password" placeholder="Password daalein..." required>
        <button id="login-btn">Login Karein</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- 3. CHAT SCREEN -->
    <div id="chat-screen" style="display: none;">
        <div id="love-background">
            <span class="bg-text" style="top: 5%; left: 5%;">Janan loves Mino 💕</span>
            <span class="bg-text" style="top: 15%; right: 5%;">Mino loves Janan ❤️</span>
            <span class="bg-text" style="top: 25%; left: 10%;">Zargoo 🥰</span>
            <span class="bg-text" style="top: 35%; right: 10%;">Jwandun 🧸</span>
            <span class="bg-text" style="top: 45%; left: 5%;">Mama 🌸</span>
            <span class="bg-text" style="top: 55%; right: 15%;">Kachocho 🐻</span>
            <span class="bg-text" style="top: 65%; left: 15%;">Katoto ✨</span>
            <span class="bg-text" style="top: 75%; right: 5%;">Zra Sar 😘</span>
            <span class="bg-text" style="top: 85%; left: 10%;">Love 💖</span>
            <span class="bg-text" style="top: 10%; left: 40%;">Bacha 💕</span>
            <span class="bg-text" style="top: 30%; left: 45%;">Kachocha ❤️</span>
            <span class="bg-text" style="top: 50%; right: 40%;">Sqaman 💕</span>
            <span class="bg-text" style="top: 70%; left: 30%;">Jan 💖</span>
            <span class="bg-text" style="top: 90%; right: 30%;">Mino ❤️</span>
        </div>

        <header>
            <div class="header-left">
                <h3>❤️ Janan & Mino</h3>
                <span id="partner-status">Offline</span>
            </div>
            <div class="header-right">
                <button id="clear-chat-btn" title="Clear Chat">🗑️</button>
                <button id="logout-btn">Logout</button>
            </div>
        </header>
        
        <div id="messages-container"></div>
        
        <div id="reply-preview">
            <span id="reply-text"></span>
            <button id="cancel-reply">✖</button>
        </div>

        <div id="input-area">
            <div class="input-wrapper">
                <button class="emoji-btn" id="emoji-btn">😊</button>
                <textarea id="message-input" rows="1" placeholder="Yahan likhein..."></textarea>
            </div>
            <button id="send-btn">➤</button>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDocs, deleteDoc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxiEXvK-xeepTuYRYdizeFqNufzb--3Ac",
            authDomain: "chat-8e3ff.firebaseapp.com",
            projectId: "chat-8e3ff",
            storageBucket: "chat-8e3ff.firebasestorage.app",
            messagingSenderId: "576628137714",
            appId: "1:576628137714:web:551e0f79bb8cd5df9b7a6b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ROMANTIC CHIME SOUND ---
        function playRomanticChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
                gain1.gain.setValueAtTime(0.3, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.8);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(659.25, ctx.currentTime);
                    gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.8);
                }, 150);
            } catch (e) { console.log("Sound error:", e); }
        }

        // --- NOTES APP (DISGUISE) ---
        const notesScreen = document.getElementById('notes-screen');
        const noteContent = document.getElementById('note-content');
        const saveNoteBtn = document.getElementById('save-note-btn');
        const SECRET_CODE = "Janan"; 

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        saveNoteBtn.addEventListener('click', () => {
            if (noteContent.value.trim() === SECRET_CODE) {
                noteContent.value = ""; 
                notesScreen.style.display = 'none';
                if(auth.currentUser) {
                    document.getElementById('chat-screen').style.display = 'flex';
                    markMessagesAsRead(); 
                } else {
                    document.getElementById('login-screen').style.display = 'flex';
                }
                return;
            }
            noteContent.value = "";
            document.getElementById('note-status').innerText = "Note Saved Successfully!";
            setTimeout(() => { document.getElementById('note-status').innerText = ""; }, 2000);
        });

        // --- CHAT LOGIC ---
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messageInput = document.getElementById('message-input');
        const messagesContainer = document.getElementById('messages-container');
        const partnerStatus = document.getElementById('partner-status');
        
        let isFirstLoad = true; 
        let typingTimeout;
        let replyingToText = null;

        // --- REPLY SWIPE ---
        const replyPreview = document.getElementById('reply-preview');
        const replyText = document.getElementById('reply-text');
        
        document.getElementById('cancel-reply').addEventListener('click', () => {
            replyingToText = null;
            replyPreview.style.display = 'none';
        });

        function setupSwipeToReply(element, text) {
            let startX = 0;
            element.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive: true});
            element.addEventListener('touchend', (e) => {
                let endX = e.changedTouches[0].clientX;
                if (endX - startX > 60) { 
                    replyingToText = text;
                    replyText.innerText = text;
                    replyPreview.style.display = 'flex';
                    messageInput.focus();
                }
            }, {passive: true});
        }

        // --- LOGIN FIX ---
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .then(() => {
                document.getElementById('login-error').innerText = "";
                // Login hote hi direct chat screen dikhao
                loginScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                markMessagesAsRead();
            })
            .catch(() => {
                document.getElementById('login-error').innerText = "Ghalat email ya password!";
                document.getElementById('login-error').style.color = "#d32f2f";
            });
        });

        document.getElementById('logout-btn').addEventListener('click', async () => { 
            if(auth.currentUser) {
                await setDoc(doc(db, "status", auth.currentUser.uid), { online: false, typing: false, lastSeen: serverTimestamp() }, { merge: true });
            }
            signOut(auth); 
            chatScreen.style.display = 'none';
            notesScreen.style.display = 'flex';
            messageInput.value = "";
        });

        document.getElementById('clear-chat-btn').addEventListener('click', async () => {
            if(confirm("Kya aap waqai saari chat delete karna chahte hain?")) {
                const snapshot = await getDocs(query(collection(db, "messages")));
                snapshot.forEach(async (document) => { await deleteDoc(doc(db, "messages", document.id)); });
            }
        });

        // --- AUTH STATE (Background Check) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Agar user pehle se login hai aur notes screen par hai, toh kuch na karo
                // Jab woh secret code dale ga tab chat khulegi
                
                setDoc(doc(db, "status", user.uid), { online: true, typing: false, lastSeen: serverTimestamp() }, { merge: true });

                onSnapshot(collection(db, "status"), (snapshot) => {
                    snapshot.forEach((docSnap) => {
                        if (docSnap.id !== user.uid) {
                            const data = docSnap.data();
                            if (data.typing) {
                                partnerStatus.innerText = "Typing... ✍️";
                                partnerStatus.style.color = "#d81b60"; 
                            } else if (data.online) {
                                partnerStatus.innerText = "Online 🟢";
                                partnerStatus.style.color = "#4CAF50";
                            } else {
                                if(data.lastSeen) {
                                    partnerStatus.innerText = "Last seen: " + data.lastSeen.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                } else {
                                    partnerStatus.innerText = "Last seen: recently";
                                }
                                partnerStatus.style.color = "#888";
                            }
                        }
                    });
                });

                loadMessages(user.uid);
            } else {
                messagesContainer.innerHTML = '';
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (auth.currentUser) {
                if (document.visibilityState === "hidden") {
                    setDoc(doc(db, "status", auth.currentUser.uid), { online: false, typing: false, lastSeen: serverTimestamp() }, { merge: true });
                } else {
                    setDoc(doc(db, "status", auth.currentUser.uid), { online: true }, { merge: true });
                    markMessagesAsRead(); 
                }
            }
        });

        // --- TYPING INDICATOR ---
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = 'auto';

            if (!auth.currentUser) return;
            setDoc(doc(db, "status", auth.currentUser.uid), { typing: true }, { merge: true });

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                setDoc(doc(db, "status", auth.currentUser.uid), { typing: false }, { merge: true });
            }, 2000); 
        });

        // --- SEND MESSAGE ---
        document.getElementById('send-btn').addEventListener('click', async () => {
            const text = messageInput.value.trim();
            if (text === "") return;

            playRomanticChime();

            const msgData = {
                text: text,
                sender: auth.currentUser.uid,
                read: false,
                createdAt: serverTimestamp()
            };

            if (replyingToText) {
                msgData.replyTo = replyingToText; 
                replyingToText = null;
                replyPreview.style.display = 'none';
            }

            try {
                await addDoc(collection(db, "messages"), msgData);
                messageInput.value = ""; 
                messageInput.style.height = 'auto'; 
                clearTimeout(typingTimeout);
                setDoc(doc(db, "status", auth.currentUser.uid), { typing: false }, { merge: true });
            } catch (e) { console.error("Error: ", e); }
        });

        // --- READ RECEIPTS ---
        async function markMessagesAsRead() {
            if (!auth.currentUser || chatScreen.style.display !== 'flex') return;
            try {
                const q = query(collection(db, "messages"), where("read", "==", false));
                const snapshot = await getDocs(q);
                snapshot.forEach(async (docSnap) => {
                    const data = docSnap.data();
                    if (data.sender !== auth.currentUser.uid) {
                        await updateDoc(doc(db, "messages", docSnap.id), { read: true });
                    }
                });
            } catch(e) { console.log("Read error", e); }
        }

        // --- LOAD MESSAGES ---
        function loadMessages(myUid) {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            
            onSnapshot(q, (snapshot) => {
                let hasNewMessage = false;

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !isFirstLoad) {
                        if (change.doc.data().sender !== myUid) hasNewMessage = true;
                    }
                });

                if (hasNewMessage && chatScreen.style.display === 'flex') {
                    playRomanticChime(); 
                    markMessagesAsRead(); 
                }

                isFirstLoad = false;
                messagesContainer.innerHTML = ""; 
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const msgDiv = document.createElement('div');
                    
                    if (data.sender === myUid) {
                        msgDiv.className = 'msg-bubble msg-sent';
                    } else {
                        msgDiv.className = 'msg-bubble msg-received';
                    }
                    
                    if (data.replyTo) {
                        const replyBox = document.createElement('div');
                        replyBox.className = 'msg-reply-box';
                        replyBox.innerText = data.replyTo;
                        msgDiv.appendChild(replyBox);
                    }

                    const textSpan = document.createElement('span');
                    textSpan.innerText = data.text;
                    msgDiv.appendChild(textSpan);

                    const metaDiv = document.createElement('div');
                    metaDiv.style.display = "flex";
                    metaDiv.style.alignItems = "center";
                    metaDiv.style.justifyContent = "flex-end";
                    metaDiv.style.gap = "5px";
                    metaDiv.style.marginTop = "5px";

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'msg-time';
                    timeSpan.style.margin = "0";
                    if (data.createdAt) {
                        timeSpan.innerText = data.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                    metaDiv.appendChild(timeSpan);

                    if (data.sender === myUid) {
                        const tickSpan = document.createElement('span');
                        tickSpan.style.fontSize = "12px";
                        if (data.read) {
                            tickSpan.innerText = "✓✓"; 
                            tickSpan.style.color = "#53bdeb"; 
                        } else {
                            tickSpan.innerText = "✓"; 
                            tickSpan.style.color = "rgba(255,255,255,0.7)";
                        }
                        metaDiv.appendChild(tickSpan);
                    }

                    msgDiv.appendChild(metaDiv);
                    messagesContainer.appendChild(msgDiv);
                    setupSwipeToReply(msgDiv, data.text);
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }
    </script>
</body>
</html>
